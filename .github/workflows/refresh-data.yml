# Monthly data refresh: runs on the first business day of every month
# (09:00 Istanbul) and can be started by hand from the Actions tab.
# Updates data/prices.json (price levels, fallback exchange rates, US inflation
# factor for base costs) and data/cities.json (airports and cities), then
# commits; Cloudflare Pages deploys the commit automatically.
name: Refresh data

on:
  schedule:
    - cron: '0 6 1-3 * *'     # days 1–3; the first step keeps only the first business day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: First business day of the month?
        id: when
        run: |
          d=$(date -u +%-d); dow=$(date -u +%u)   # dow: 1 = Monday … 7 = Sunday
          run=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then run=yes
          elif [ "$d" = 1 ] && [ "$dow" -le 5 ]; then run=yes
          elif [ "$d" -le 3 ] && [ "$dow" = 1 ]; then run=yes   # 1st fell on a weekend
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Day $d, weekday $dow -> run=$run"

      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'yes'

      - name: Refresh prices (price levels, fallback FX, US inflation)
        if: steps.when.outputs.run == 'yes'
        run: python3 tools/refresh_prices.py data/prices.json

      - name: Rebuild airport / city list
        if: steps.when.outputs.run == 'yes'
        run: |
          set -e
          work=$(mktemp -d)
          git clone --depth 1 https://github.com/davidmegginson/ourairports-data "$work/ourairports"
          (cd "$work" && npm init -y >/dev/null && npm install --silent all-the-cities@3 pbf@3)
          node tools/dump_geonames.js "$work/node_modules/all-the-cities" "$work/geonames.json"
          cp data/cities.json "$work/cities.prev.json"
          python3 tools/build_cities.py "$work/ourairports" "$work/geonames.json" data/cities.json
          count=$(python3 -c "import json;print(len(json.load(open('data/cities.json'))))")
          echo "cities: $count"
          if [ "$count" -lt 2500 ]; then
            echo "Too few cities, keeping the previous list"; cp "$work/cities.prev.json" data/cities.json
          fi

      - name: Commit changes
        if: steps.when.outputs.run == 'yes'
        run: |
          if git diff --quiet -- data; then echo "No changes"; exit 0; fi
          git config user.name "waybudget-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)"
          git push
