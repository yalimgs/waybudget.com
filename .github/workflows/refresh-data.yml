# Weekly data refresh: every Monday 09:00 Istanbul (06:00 UTC). If Monday's
# run did not fully succeed, it is retried on Tuesday at the same time.
# Can also be started by hand from the Actions tab.
# Updates data/prices.json (price levels, fallback exchange rates, US inflation
# factor for base costs) and data/cities.json (airports and cities), then
# commits; Cloudflare Pages deploys the commit automatically.
name: Refresh data

on:
  schedule:
    - cron: '0 6 * * 1'       # Monday
    - cron: '0 6 * * 2'       # Tuesday: retry only if Monday failed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Should this run?
        id: when
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=yes
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = 2 ]; then
            since=$(date -u -d 'yesterday 00:00' +%Y-%m-%dT%H:%M:%SZ)
            ok=$(gh api "repos/${{ github.repository }}/actions/workflows/refresh-data.yml/runs?status=success&created=>=$since" --jq '.total_count')
            if [ "$ok" -gt 0 ]; then run=no; echo "Monday run succeeded, no retry needed"; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'yes'

      - name: Refresh prices (price levels, fallback FX, US inflation)
        id: prices
        if: steps.when.outputs.run == 'yes'
        continue-on-error: true
        run: python3 tools/refresh_prices.py data/prices.json

      - name: Rebuild airport / city list
        id: cities
        if: steps.when.outputs.run == 'yes'
        continue-on-error: true
        run: |
          set -e
          work=$(mktemp -d)
          git clone --depth 1 https://github.com/davidmegginson/ourairports-data "$work/ourairports"
          (cd "$work" && npm init -y >/dev/null && npm install --silent all-the-cities@3 pbf@3)
          node tools/dump_geonames.js "$work/node_modules/all-the-cities" "$work/geonames.json"
          cp data/cities.json "$work/cities.prev.json"
          python3 tools/build_cities.py "$work/ourairports" "$work/geonames.json" data/cities.json
          count=$(python3 -c "import json;print(len(json.load(open('data/cities.json'))))")
          echo "cities: $count"
          if [ "$count" -lt 2500 ]; then
            echo "Too few cities, keeping the previous list"; cp "$work/cities.prev.json" data/cities.json
          fi

      - name: Commit changes
        if: steps.when.outputs.run == 'yes'
        run: |
          if git diff --quiet -- data; then echo "No changes"; exit 0; fi
          git config user.name "waybudget-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Weekly data refresh $(date -u +%Y-%m-%d)"
          git push

      # Saved what worked above; now mark the run failed if anything did not,
      # so Tuesday's retry runs.
      - name: Report partial failure
        if: steps.when.outputs.run == 'yes' && (steps.prices.outcome == 'failure' || steps.cities.outcome == 'failure')
        run: |
          echo "prices: ${{ steps.prices.outcome }}, cities: ${{ steps.cities.outcome }}"
          exit 1
