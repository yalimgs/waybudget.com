<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayBudget - Plan Your Trip</title>
    <style>
        /* Center container and style the form for a modern look */
        .container { 
            max-width: 400px; 
            margin: 50px auto; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            text-align: center; 
        }
        .input-group { margin-bottom: 15px; position: relative; text-align: left; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        
        /* City search results list styling */
        #cityResults { 
            border: 1px solid #ccc; display:none; list-style:none; padding:0; margin:0; 
            position: absolute; background: white; width: 100%; z-index: 1000; 
            max-height: 150px; overflow-y: auto; border-radius: 5px;
        }
        #cityResults li { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        #cityResults li:hover { background-color: #f0f0f0; }
        
        button {
            width: 100%; padding: 12px; background-color: #007bff; color: white;
            font-weight: bold; cursor: pointer; border: none; border-radius: 5px; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WayBudget</h1>
        
        <div class="input-group">
            <label for="destination">Destination (City):</label>
            <input type="text" id="destination" placeholder="Type to search..." oninput="filterCities(this.value)">
            <ul id="cityResults"></ul>
        </div>

        <div class="input-group">
            <label for="date">Travel Date:</label>
            <input type="date" id="date">
        </div>

        <button type="button" onclick="submitTrip()">Plan My Budget</button>
    </div>

    <script>
        // List of available cities for the autocomplete feature
        const allCities = ["Istanbul", "Antalya", "Bodrum", "Izmir", "Ankara", "Cappadocia", "Fethiye", "Cesme", "Kas"];
        let selectedCity = ""; 

        // Filter the city list based on user input
        function filterCities(val) {
            const results = document.getElementById('cityResults');
            results.innerHTML = '';
            selectedCity = ""; 
            
            if (val.length > 0) {
                const filtered = allCities.filter(c => c.toLowerCase().includes(val.toLowerCase()));
                if (filtered.length > 0) {
                    results.style.display = 'block';
                    filtered.forEach(city => {
                        const li = document.createElement('li');
                        li.textContent = city;
                        li.onclick = () => { 
                            document.getElementById('destination').value = city;
                            selectedCity = city; 
                            results.style.display = 'none';
                        };
                        results.appendChild(li);
                    });
                    return;
                }
            }
            results.style.display = 'none';
        }

        // Validate form inputs and proceed to budget planning
        function submitTrip() {
            const dateValue = document.getElementById('date').value;
            const today = new Date().toISOString().split('T')[0];

            // Ensure a valid city is selected from the list
            if (!selectedCity) {
                alert("Please select a valid city from the list.");
                return;
            }
            // Ensure a date is selected
            if (!dateValue) {
                alert("Please select a travel date.");
                return;
            }
            // Ensure the date is not in the past
            if (dateValue < today) {
                alert("You cannot select a past date.");
                return;
            }

            alert("Great! Planning your budget for " + selectedCity + " on " + dateValue + ".");
        }
    </script>
</body>
</html>
