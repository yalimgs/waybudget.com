<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WayBudget - Plan Your Trip</title>
</head>
<body>
    <h1>Welcome to WayBudget</h1>
    <form id="tripForm">
        <label for="destination">Destination (City):</label>
        <input list="cities" id="destination" name="destination" placeholder="Type or select a city" required>
        <datalist id="cities"></datalist>
        
        <br><br>
        <label for="date">Travel Date:</label>
        <input type="date" id="date" name="date" required>
        <br><br>
        <button type="button" onclick="submitTrip()">Plan My Budget</button>
    </form>

    <script>
        // Sayfa yüklendiğinde JSON dosyasını çek
        fetch('cities.json')
            .then(response => response.json())
            .then(data => {
                const dataList = document.getElementById('cities');
                data.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    dataList.appendChild(option);
                });
            });

        function submitTrip() {
            // ... (submitTrip fonksiyonun aynı kalabilir)
        }
    </script>
</body>
</html>
