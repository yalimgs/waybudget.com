<!-- ============================================================================
// File: index.html
// Purpose: Main entry point for the WayBudget application. Defines the UI structure.
// ============================================================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayBudget - Route Budget Planner</title>
    
    <!-- Link to external stylesheet for application styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>WayBudget</h1>
        
        <!-- Input section for departure city selection with auto-complete capability -->
        <div class="input-group">
            <label for="origin">From:</label>
            <input type="text" id="origin" placeholder="Departure..." oninput="filterCities(this.value, 'origin')">
            <ul id="originResults" class="city-results"></ul>
        </div>

        <!-- Input section for destination city selection with auto-complete capability -->
        <div class="input-group">
            <label for="destination">To:</label>
            <input type="text" id="destination" placeholder="Arrival..." oninput="filterCities(this.value, 'destination')">
            <ul id="destinationResults" class="city-results"></ul>
        </div>

        <!-- Date selection fields for trip duration calculation -->
        <div class="input-group">
            <label for="startDate">Start:</label>
            <input type="date" id="startDate" onchange="updateMinEndDate(); updateRouteSummary();">
        </div>

        <div class="input-group">
            <label for="endDate">End:</label>
            <input type="date" id="endDate" onchange="updateRouteSummary()">
        </div>

        <!-- Main action button to initiate the route planning process -->
        <button type="button" onclick="submitTrip()">Plan My Route</button>

        <!-- Container for displaying the calculated route and budget summary -->
        <div id="summaryDisplay"></div>
    </div>

    <!-- Scripts for city searching logic and main application functionality -->
    <script src="search.js"></script>
    <script src="app.js"></script>
</body>
</html>
