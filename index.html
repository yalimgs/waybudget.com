<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayBudget - Route Budget Planner</title>
    <style>
        .container { 
            max-width: 400px; margin: 40px auto; font-family: 'Segoe UI', Tahoma, sans-serif; 
            padding: 20px; border: 1px solid #ddd; border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); background-color: #fff; text-align: center; 
        }
        h1 { font-size: 22px; margin-bottom: 20px; color: #333; }
        
        .input-group { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; position: relative; }
        label { flex: 0 0 70px; font-weight: 600; color: #555; text-align: left; font-size: 14px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        .city-results { 
            border: 1px solid #ccc; display: none; list-style: none; padding: 0; margin: 0; 
            position: absolute; top: 100%; left: 80px; width: calc(100% - 80px); 
            z-index: 1000; max-height: 150px; overflow-y: auto; background: white; 
            border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .city-results li { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 13px; text-align: left;}
        .city-results li:hover { background-color: #f7f7f7; }
        
        #summaryDisplay { margin-top: 15px; font-size: 14px; color: #555; font-weight: 500; text-align: center; line-height: 1.6; }
        
        button { 
            width: 100%; padding: 12px; background-color: #007bff; color: white; 
            border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>WayBudget</h1>
        
        <div class="input-group">
            <label for="origin">From:</label>
            <input type="text" id="origin" placeholder="Departure..." oninput="filterCities(this.value, 'origin')">
            <ul id="originResults" class="city-results"></ul>
        </div>

        <div class="input-group">
            <label for="destination">To:</label>
            <input type="text" id="destination" placeholder="Arrival..." oninput="filterCities(this.value, 'destination')">
            <ul id="destinationResults" class="city-results"></ul>
        </div>

        <div class="input-group">
            <label for="startDate">Start:</label>
            <input type="date" id="startDate" onchange="updateMinEndDate(); updateRouteSummary();">
        </div>

        <div class="input-group">
            <label for="endDate">End:</label>
            <input type="date" id="endDate" onchange="updateRouteSummary()">
        </div>

        <button type="button" onclick="submitTrip()">Plan My Route</button>

        <div id="summaryDisplay"></div>
    </div>

    <script>
        let allData = []; 
        let tripData = { origin: "", destination: "" };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('startDate').setAttribute('min', new Date().toISOString().split('T')[0]);
        });

        fetch('countries+cities.json')
            .then(res => res.json())
            .then(data => { allData = data; })
            .catch(err => console.error('Data loading error:', err));

        function normalizeText(text) {
            return text.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
                .replace(/ı/g, 'i').replace(/i̇/g, 'i');
        }

        function filterCities(val, type) {
            const results = document.getElementById(type + 'Results');
            
            // Eğer input silinirse, veriyi temizle ve özeti güncelle
            if (val.trim() === "") {
                tripData[type] = "";
                results.style.display = 'none';
                updateRouteSummary();
                return;
            }

            results.innerHTML = '';
            if (val.length < 2) { results.style.display = 'none'; return; }

            const queryTokens = normalizeText(val).replace(/,/g, ' ').split(' ').filter(t => t.length > 0);
            let matches = [];

            allData.forEach(country => {
                country.cities.forEach(city => {
                    const fullString = normalizeText(`${city} ${country.name}`);
                    const isMatch = queryTokens.every(t => fullString.includes(t));
                    
                    if (isMatch) {
                        let score = normalizeText(city).startsWith(queryTokens[0]) ? 100 : 50;
                        matches.push({ name: `${city}, ${country.name}`, score: score });
                    }
                });
            });

            matches.sort((a, b) => b.score - a.score);

            if (matches.length > 0) {
                results.style.display = 'block';
                matches.slice(0, 8).forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item.name;
                    li.onclick = () => { 
                        document.getElementById(type).value = item.name;
                        tripData[type] = item.name;
                        results.style.display = 'none';
                        updateRouteSummary();
                    };
                    results.appendChild(li);
                });
            } else { results.style.display = 'none'; }
        }

        function updateRouteSummary() {
            const startVal = document.getElementById('startDate').value;
            const endVal = document.getElementById('endDate').value;
            const display = document.getElementById('summaryDisplay');
            
            let lines = [];
            if (tripData.origin && tripData.destination) lines.push(`Route: ${tripData.origin} ➔ ${tripData.destination}`);
            
            if (startVal && endVal) {
                lines.push(`Dates: ${startVal} to ${endVal}`);
                const start = new Date(startVal);
                const end = new Date(endVal);
                const diffDays = Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24));
                lines.push(`Duration: ${diffDays} nights, ${diffDays + 1} days`);
            }
            display.innerHTML = lines.join('<br>');
        }

        function updateMinEndDate() {
            const startVal = document.getElementById('startDate').value;
            const endDateInput = document.getElementById('endDate');
            
            if (!startVal) {
                endDateInput.min = "";
                return;
            }
            
            const minEnd = new Date(startVal);
            minEnd.setDate(minEnd.getDate() + 1);
            endDateInput.min = minEnd.toISOString().split('T')[0];
            
            if (endDateInput.value && endDateInput.value <= startVal) {
                endDateInput.value = '';
            }
            updateRouteSummary();
        }

        function submitTrip() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            
            if (!tripData.origin || !tripData.destination || !start || !end) {
                alert("Please fill in Origin, Destination, and both travel dates.");
                return;
            }
            
            alert(`Route: ${tripData.origin} ➔ ${tripData.destination}\n` +
                  `Dates: ${start} to ${end}.\n\n` +
                  `WayBudget budget planner is coming soon, stay tuned!`);
        }
    </script>
</body>
</html>
