<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayBudget - Plan Your Trip</title>
    <style>
        .container { max-width: 400px; margin: 50px auto; font-family: 'Segoe UI', sans-serif; padding: 20px; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        .input-group { margin-bottom: 15px; position: relative; text-align: left; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        #cityResults { border: 1px solid #ccc; display:none; list-style:none; padding:0; margin:0; position: absolute; background: white; width: 100%; z-index: 1000; max-height: 200px; overflow-y: auto; border-radius: 5px; }
        #cityResults li { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        #cityResults li:hover { background-color: #f0f0f0; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>WayBudget</h1>
        <div class="input-group">
            <label for="destination">Destination (City, Country):</label>
            <input type="text" id="destination" placeholder="Search city or country..." oninput="filterCities(this.value)">
            <ul id="cityResults"></ul>
        </div>
        <div class="input-group">
            <label for="startDate">Start Date:</label>
            <input type="date" id="startDate" onchange="updateMinEndDate()">
        </div>
        <div class="input-group">
            <label for="endDate">End Date:</label>
            <input type="date" id="endDate">
        </div>
        <button type="button" onclick="submitTrip()">Plan My Budget</button>
    </div>

    <script>
        let allData = []; // To store the entire JSON structure
        let selectedCity = ""; 

        // Set start date minimum to today
        document.getElementById('startDate').setAttribute('min', new Date().toISOString().split('T')[0]);

        // Load data from the external JSON file
        fetch('countries+cities.json')
            .then(response => response.json())
            .then(data => { allData = data; })
            .catch(error => console.error('Error loading data:', error));

        // Optimized flexible search engine
        function filterCities(val) {
            const results = document.getElementById('cityResults');
            results.innerHTML = '';
            selectedCity = ""; 
            
            if (val.length < 2) { results.style.display = 'none'; return; }

            const query = val.toLowerCase();
            let filteredResults = [];
            
            allData.forEach(country => {
                country.cities.forEach(city => {
                    const fullMatchString = `${city.toLowerCase()}, ${country.name.toLowerCase()}`;
                    
                    if (fullMatchString.includes(query)) {
                        if (filteredResults.length < 10) {
                            filteredResults.push(`${city}, ${country.name}`);
                        }
                    }
                });
            });

            if (filteredResults.length > 0) {
                results.style.display = 'block';
                filteredResults.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    li.onclick = () => { 
                        document.getElementById('destination').value = item;
                        selectedCity = item; 
                        results.style.display = 'none';
                    };
                    results.appendChild(li);
                });
            } else {
                results.style.display = 'none';
            }
        }

        // Restrict end date to be equal or after start date
        function updateMinEndDate() {
            const startDate = document.getElementById('startDate').value;
            const endDateInput = document.getElementById('endDate');
            endDateInput.min = startDate;
            if (endDateInput.value && endDateInput.value < startDate) endDateInput.value = '';
        }

        // Validate and summarize the trip plan
        function submitTrip() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            
            if (!selectedCity || !start || !end || end <= start) {
                alert("Please complete the form with valid trip details.");
                return;
            }
            
            const summary = `Great! Planning your budget for ${selectedCity}.\n` +
                            `Duration: between ${start} and ${end}.\n\n` +
                            `Our trip planning engine is starting soon, stay tuned!`;
            
            alert(summary);
        }
    </script>
</body>
</html>
